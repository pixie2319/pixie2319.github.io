<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Connecting</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b1220; color: #7fe7ff; font: 20px/1.5 system-ui, sans-serif; }
  main { max-width: 32rem; padding: 24px 16px; text-align: center; }
  .err { color: #ff8a8a; }
</style>
</head>
<body>
<main id="msg">Connecting to Jarvis...</main>
<script>
  // TikTok lands here after login. The one-time code goes straight to the
  // listener on this same PC (127.0.0.1:8820), which trades it for a token.
  // Nothing is stored or sent anywhere else.
  var p = new URLSearchParams(location.search);
  var msg = document.getElementById("msg");
  if (p.get("error")) {
    msg.className = "err";
    msg.textContent = "TikTok login didn't go through: " + p.get("error") +
      (p.get("error_description") ? " (" + p.get("error_description") + ")" : "");
  } else if (p.get("code")) {
    location.replace("http://127.0.0.1:8820/callback" + location.search);
  } else {
    msg.textContent = "Nothing to do here.";
  }
</script>
</body>
</html>
